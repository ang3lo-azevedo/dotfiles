name: build

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up nixbuild SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NIXBUILD_KEY }}" > ~/.ssh/nixbuild_key
          chmod 600 ~/.ssh/nixbuild_key
          cat >> ~/.ssh/config <<'SSHCFG'
          Host eu.nixbuild.net
            IdentityFile ~/.ssh/nixbuild_key
            PubkeyAcceptedKeyTypes ssh-ed25519
            ServerAliveInterval 60
            StrictHostKeyChecking accept-new
          SSHCFG

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            builders = ssh-ng://eu.nixbuild.net?system=x86_64-linux&max-jobs=100&supported-features=benchmark,big-parallel
            builders-use-substitutes = true
            max-jobs = 0

      - name: Build system
        run: nix build .#nixosConfigurations.pc-angelo.config.system.build.toplevel

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: accept-flake-config = true

      - name: Lint
        run: nix build .#checks.x86_64-linux.pre-commit-check
