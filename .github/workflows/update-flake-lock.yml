name: update-flake-lock
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PAT_TOKEN }}

      - uses: nixbuild/nix-quick-install-action@v35

      - uses: nixbuild/nixbuild-action@v25
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}

      - name: Update flake.lock
        run: |
          nix flake update --accept-flake-config
          channel_rev=$(curl -sI https://channels.nixos.org/nixos-unstable | grep -i "^location:" | tr -d '\r' | awk '{print $2}' | grep -oE '[a-f0-9]{12}$')
          [ -n "$channel_rev" ] && nix flake lock --override-input nixpkgs "github:NixOS/nixpkgs/$channel_rev" --accept-flake-config || true

      - name: Update custom packages
        run: nix run nixpkgs#nvfetcher -- -c pkgs/nvfetcher.toml -o pkgs/_sources

      - name: Update private Binary Ninja
        run: |
          cd private/binary-ninja
          git checkout main
          python3 update-binja.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source.json
          git diff --staged --quiet || git commit -m "chore: auto-update binary-ninja version"
          git push origin main
          cd ../..

      - name: Build system closure
        run: nix build .#nixosConfigurations.pc-angelo.config.system.build.toplevel --no-link --print-build-logs --keep-going || true

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock pkgs/_sources/generated.nix pkgs/_sources/generated.json
          git diff --staged --quiet || git commit -m "chore: update flake.lock and package sources"
          git push
