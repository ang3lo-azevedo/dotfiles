name: update-flake-lock
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: nixbuild/nix-quick-install-action@v35

      - uses: nixbuild/nixbuild-action@v25
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}

      - name: Update flake.lock
        run: nix flake update --accept-flake-config

      - name: Update custom packages
        run: nix run nixpkgs#nvfetcher -- -c pkgs/nvfetcher.toml -o pkgs/_sources

      - name: Build system closure
        run: nix build .#nixosConfigurations.pc-angelo.config.system.build.toplevel --no-link --print-build-logs

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock pkgs/_sources/generated.nix pkgs/_sources/generated.json
          git diff --staged --quiet || git commit -m "chore: update flake.lock and package sources"
          git push
