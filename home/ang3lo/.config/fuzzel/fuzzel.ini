icon-theme=Tela-dark
icons-enabled=yes

[colors]
background=000000ff
text=eeeeeeff
match=ffffffff
selection-match=ffffffff
selection=2a2a2aff
selection-text=ffffffff
border=ffffff1a

[border]
radius=8

[key-bindings]
# Vim motions for the app search: Ctrl+k up, Ctrl+j down (arrows still work).
# Ctrl+k defaults to delete-line-forward, so free it first or the prev bind conflicts.
delete-line-forward=none
prev=Up Control+k
next=Down Control+j